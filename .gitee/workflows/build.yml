name: 构建发布

trigger: "^[Vv]?\\d+(\\.\\d+)*(-.*)?$"   # 只在 tag 时触发
on:
  push:
    tags:
      - '*'

env:
  VERSION: '1.4.0'

stages:
  - stage: build
    name: 编译
    runs-on:
      - windows-latest
    script:
      - dotnet restore "$BUILD_DIR/ScannerAssistant.csproj"
      - dotnet build "$BUILD_DIR/ScannerAssistant.csproj" --configuration Release --no-restore
      - mkdir -p release
      - copy "$BUILD_DIR\bin\Release\日期提醒.exe" release\
      - copy "$BUILD_DIR\bin\Release\"*.dll release\ 2>nul
      - copy "$BUILD_DIR\bin\Release\"*.config release\ 2>nul
      - copy "$BUILD_DIR\app.ico" release\ 2>nul
      - cd release && powershell -Command "Compress-Archive -Path '*' -DestinationPath '../日期提醒_v${{env.VERSION}}_Release.zip' -Force"

  - stage: upload
    name: 上传产物
    runs-on:
      - windows-latest
    needs: ['build']
    script:
      - gitee-actions/upload@v1 --name release-package --path '日期提醒_v${{env.VERSION}}_Release.zip'
    artifacts:
      - name: release-package
        paths:
          - '日期提醒_v${{env.VERSION}}_Release.zip'
        type: zip
        expire_in: 30 days