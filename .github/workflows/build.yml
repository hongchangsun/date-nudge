name: Build DateNudge WinForms EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ScannerAssistant.csproj

      - name: Build Project (Release)
        run: |
          msbuild ScannerAssistant.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /t:Rebuild

      - name: Find and list output files
        run: |
          Get-ChildItem -Path . -Recurse -Filter "*.exe" | Select-Object FullName
          Get-ChildItem -Path . -Recurse -Filter "*.dll" | Select-Object FullName

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateNudge-EXE
          path: |
            **/bin/Release/**/日期提醒.exe
            **/bin/Release/**/日期提醒.dll
            **/bin/Release/**/日期提醒.exe.config
            **/bin/Release/**/*.dll
          if-no-files-found: error
