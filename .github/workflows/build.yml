name: Build DateNudge WinForms EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: |
          nuget restore ScannerAssistant.csproj
          nuget restore UpdateHelper/UpdateHelper.csproj

      - name: Build Project (Release)
        run: |
          msbuild ScannerAssistant.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /t:Rebuild
          msbuild UpdateHelper/UpdateHelper.csproj /p:Configuration=Release /v:minimal /t:Rebuild

      - name: Stage output files (fix Chinese filename)
        shell: pwsh
        run: |
          $outDir = "staging"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $srcDir = "bin\Release\net48"
          Copy-Item "$srcDir\*.exe" $outDir -Force
          Copy-Item "$srcDir\*.dll" $outDir -Force
          Copy-Item "$srcDir\*.config" $outDir -Force
          Get-ChildItem $outDir | Select-Object Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateNudge-EXE
          path: staging/
          if-no-files-found: error
