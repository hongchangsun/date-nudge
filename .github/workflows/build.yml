name: Build DateNudge WinForms EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: |
          nuget restore ScannerAssistant.csproj
          nuget restore UpdateHelper/UpdateHelper.csproj

      - name: Build Project (Release)
        run: |
          msbuild ScannerAssistant.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /t:Rebuild
          msbuild UpdateHelper/UpdateHelper.csproj /p:Configuration=Release /v:minimal /t:Rebuild

      - name: Debug: Find all exe files
        shell: pwsh
        run: |
          Write-Host "=== All .exe in repo ==="
          Get-ChildItem -Path . -Recurse -Filter "*.exe" | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== bin/ contents ==="
          if (Test-Path "bin") { Get-ChildItem -Path bin -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "bin dir NOT FOUND" }

      - name: Stage output files (fix Chinese filename)
        shell: pwsh
        run: |
          $outDir = "staging"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $srcDir = "bin\Release\net48"
          Write-Host "Source dir exists: $(Test-Path $srcDir)"
          if (Test-Path $srcDir) {
            Copy-Item "$srcDir\*" $outDir -Force
            Get-ChildItem $outDir | ForEach-Object { Write-Host "Staged: $($_.Name) ($($_.Length))" }
          } else {
            Write-Host "ERROR: Source dir not found, searching..."
            Get-ChildItem -Path . -Recurse -Include "*.exe","*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateNudge-EXE
          path: staging/
          if-no-files-found: error
