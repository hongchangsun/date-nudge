name: Build DateNudge WinForms EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: |
          nuget restore ScannerAssistant.csproj
          nuget restore UpdateHelper/UpdateHelper.csproj

      - name: Build Project (Release)
        run: |
          msbuild ScannerAssistant.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /t:Rebuild
          msbuild UpdateHelper/UpdateHelper.csproj /p:Configuration=Release /v:minimal /t:Rebuild

      - name: Stage output files (fix Chinese filename)
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "staging"
          New-Item -ItemType Directory -Path $staging -Force
          # Copy all exe and dll from Release output (PowerShell handles Chinese filenames natively)
          Get-ChildItem -Path "bin\Release\net48" -File | ForEach-Object {
            Copy-Item $_.FullName -Destination $staging
            Write-Host "Staged: $($_.Name) ($([math]::Round($_.Length/1KB, 1)) KB)"
          }
          Write-Host "Staged files:"
          Get-ChildItem -Path $staging | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateNudge-EXE
          path: staging\*
          if-no-files-found: error
