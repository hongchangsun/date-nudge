name: Build DateNudge WinForms EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Framework
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore ScannerAssistant.csproj

      - name: Build main project
        run: msbuild ScannerAssistant.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /t:Rebuild

      - name: Build UpdateHelper
        run: msbuild UpdateHelper/UpdateHelper.csproj /p:Configuration=Release /v:minimal /t:Rebuild

      - name: Find and stage ALL output files
        shell: pwsh
        run: |
          Write-Host "=== Searching for .exe and .dll ==="
          $files = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Include *.exe,*.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "\.nuget|\\node_modules|\\obj" }
          $files | ForEach-Object { Write-Host "FOUND: $($_.FullName) ($($_.Length) bytes)" }
          
          New-Item -ItemType Directory -Path "output" -Force | Out-Null
          foreach ($f in $files) {
            Copy-Item $f.FullName "output/" -Force
            Write-Host "Copied: $($f.Name)"
          }
          
          Write-Host "=== Output dir contents ==="
          Get-ChildItem "output" | ForEach-Object { Write-Host "$($_.Name) ($($_.Length))" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateNudge-EXE
          path: output/
          retention-days: 7
