name: Build DateNudge WinForms EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: |
          nuget restore ScannerAssistant.csproj
          nuget restore UpdateHelper/UpdateHelper.csproj

      - name: Build Project (Release)
        run: |
          msbuild ScannerAssistant.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /t:Rebuild
          msbuild UpdateHelper/UpdateHelper.csproj /p:Configuration=Release /v:minimal /t:Rebuild

      - name: Stage output files
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "staging"
          New-Item -ItemType Directory -Path $staging -Force
          # Search all possible output paths (Any CPU vs default)
          $paths = @(
            "bin\Any CPU\Release\net48",
            "bin\Release\net48",
            "UpdateHelper\bin\Release\net48"
          )
          foreach ($p in $paths) {
            $fullPath = Join-Path $env:GITHUB_WORKSPACE $p
            if (Test-Path $fullPath) {
              Get-ChildItem -Path $fullPath -File | ForEach-Object {
                Copy-Item $_.FullName -Destination $staging -Force
                Write-Host "Staged from $p`: $($_.Name) ($([math]::Round($_.Length/1KB, 1)) KB)"
              }
            }
          }
          Write-Host "Total staged files:"
          Get-ChildItem -Path $staging | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateNudge-EXE
          path: staging\*
          if-no-files-found: error
